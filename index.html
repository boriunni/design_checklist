<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자인 품질 체크리스트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#ffffff; --surface:#f5f5f8; --raise:#ffffff; --ink:#1b1a24; --sub:#6a6877; --line:#dedde8;
  --accent:#664fff; --accent-soft:#eeebff; --on-accent:#ffffff;
  --done:#664fff; --done-soft:#eeebff;
  --warn:#4a4858; --warn-soft:#e6e5ee;
  --must:#664fff; --must-soft:#eeebff;
  --dir:#664fff; --dir-soft:#eeebff;
  --pref:#4a4858; --pref-soft:#e6e5ee;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121118; --surface:#1c1b27; --raise:#262534; --ink:#f0eff7; --sub:#a9a7bd; --line:#34324a;
    --accent:#a597ff; --accent-soft:#2a2650; --on-accent:#14121f;
    --done:#a597ff; --done-soft:#2a2650;
    --warn:#cfcde0; --warn-soft:#2c2b3a;
    --must:#a597ff; --must-soft:#2a2650;
    --dir:#a597ff; --dir-soft:#2a2650;
    --pref:#cfcde0; --pref-soft:#2c2b3a;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.65;font-size:16px;-webkit-font-smoothing:antialiased}
.layout{max-width:1080px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:48px}
header.hero{grid-column:1/-1;padding:56px 0 24px}
.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.2;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
.hero .ver{display:inline-block;background:var(--accent);color:#fff;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;margin-bottom:14px}
.hero p{max-width:640px;color:var(--sub);margin:12px 0 0;font-size:16px}
.hero p,.sec-desc,.final .intro,.note,label.item .txt{white-space:pre-line}
nav.side{position:sticky;top:24px;align-self:start;padding-bottom:24px}
nav.side ul{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
nav.side a{display:block;padding:7px 14px;margin-left:-2px;border-left:2px solid transparent;color:var(--sub);text-decoration:none;font-size:14.5px;font-weight:500}
nav.side a:hover,nav.side a.on{color:var(--accent);border-left-color:var(--accent);font-weight:700}
.progress{margin-top:20px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.progress b{font-size:22px;font-variant-numeric:tabular-nums}
.progress small{color:var(--sub);display:block;font-size:12.5px}
.bar{height:6px;background:var(--line);border-radius:3px;margin:8px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--done);transition:width .25s}
.progress button{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--sub);padding:4px 10px;border-radius:6px;cursor:pointer}
.progress button:hover{color:var(--ink);border-color:var(--sub)}
main{padding-bottom:80px;min-width:0}
section{margin-bottom:40px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.sec-head h2{margin:0;font-size:24px;letter-spacing:-.01em}
.tag{font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:5px}
.tag.must{background:var(--accent-soft);color:var(--accent)}
.tag.opt{background:var(--warn-soft);color:var(--warn)}
.sec-desc{color:var(--sub);margin:0 0 16px;font-size:15px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 20px 10px;margin-bottom:14px}
.group h3{font-size:16px;margin:14px 0 4px;color:var(--accent)}
.group ul,.plain{list-style:none;margin:0;padding:0}
.group li+li{border-top:1px solid var(--line)}
label.item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;cursor:pointer}
label.item input{position:absolute;opacity:0;pointer-events:none}
.box{flex:none;width:22px;height:22px;margin-top:2px;border:2px solid var(--sub);border-radius:6px;display:grid;place-items:center;transition:background .15s,border-color .15s}
.box svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
label.item input:checked + .box{background:var(--done);border-color:var(--done)}
label.item input:checked + .box svg{opacity:1}
label.item input:checked ~ .txt{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--line)}
label.item input:focus-visible + .box{outline:3px solid var(--accent);outline-offset:2px}
.final{border:2px solid var(--accent)}
.final .intro{margin:14px 0 4px;font-weight:600}
.final ul{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
.final li:nth-child(2){border-top:1px solid var(--line)}
.note{margin-top:8px;padding:14px 18px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:14.5px}
footer{grid-column:1/-1;border-top:1px solid var(--line);padding:20px 0 40px;color:var(--sub);font-size:13px}
@media (max-width:860px){
  .layout{grid-template-columns:1fr;gap:0}
  nav.side{position:static;padding:0 0 20px}
  nav.side ul{display:flex;overflow-x:auto;border-left:0;border-bottom:2px solid var(--line)}
  nav.side a{white-space:nowrap;border-left:0;border-bottom:2px solid transparent;margin:0 0 -2px;padding:8px 12px}
  nav.side a:hover,nav.side a.on{border-bottom-color:var(--accent)}
  .final ul{grid-template-columns:1fr}
  .final li:nth-child(2){border-top:0}
  .final li+li{border-top:1px solid var(--line)}
  .group{padding:4px 16px 8px}
}
@media print{
  nav.side,.progress button{display:none}
  .layout{display:block}
  body{background:#fff}
  .group{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

.hero p:empty{display:none}

/* ---- 테마: 화이트 + 라이트그레이 + 시그니처 퍼플 (--accent) ---- */
.hero .ver{background:var(--accent);color:var(--on-accent);letter-spacing:.04em}
.hero h1 em{font-style:normal;color:var(--accent)}
.note{background:var(--surface);color:var(--ink);font-weight:500;border-left:4px solid var(--accent)}
.tag.must{background:var(--accent);color:var(--on-accent)}
.bar i{background:var(--accent)}
.progress b{color:var(--accent)}
.group.final{background:var(--raise)}
label.item input:checked + .box svg{stroke:var(--on-accent)}
</style>
</head>
<body>
<div class="layout">

<header class="hero">
  <span class="ver" id="ver"></span>
  <h1 id="title"></h1>
  <p id="intro"></p>
</header>

<nav class="side" aria-label="목차">
  <ul id="nav"></ul>
  <div class="progress" aria-live="polite">
    <b id="pct">0%</b>
    <small id="cnt">0 / 0 항목 완료</small>
    <div class="bar"><i id="fill"></i></div>
    <button type="button" id="reset">체크 초기화</button>
  </div>
</nav>

<main id="main"></main>

<footer id="foot"></footer>
</div>

<!-- 내용 수정은 checklist-data.js 에서 하세요 -->
<script src="checklist-data.js"></script>
<script>
(function(){
  var D=window.CHECKLIST, SVG="http://www.w3.org/2000/svg";
  var KEY="design-checklist:"+D.version;

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}

  var saved=[];
  try{saved=JSON.parse(localStorage.getItem(KEY)||"[]");}catch(e){}
  var inputs=[];

  function item(text){
    var li=el("li"), lab=el("label","item"), inp=document.createElement("input");
    inp.type="checkbox"; inp.checked=saved.indexOf(text)>-1; inp.dataset.key=text;
    var box=el("span","box"), svg=document.createElementNS(SVG,"svg"), p=document.createElementNS(SVG,"path");
    svg.setAttribute("viewBox","0 0 16 16"); p.setAttribute("d","M3 8.5l3.2 3L13 4.5"); svg.appendChild(p); box.appendChild(svg);
    lab.appendChild(inp); lab.appendChild(box); lab.appendChild(el("span","txt",text)); li.appendChild(lab);
    inputs.push(inp); inp.addEventListener("change",update);
    return li;
  }
  function list(items){var ul=el("ul");items.forEach(function(t){ul.appendChild(item(t));});return ul;}

  document.title=D.title+" "+D.version;
  document.getElementById("ver").textContent=D.version;
  (function(){var t=document.getElementById("title"),i=D.title.lastIndexOf(" ");
  if(i>0){t.appendChild(document.createTextNode(D.title.slice(0,i+1)));var em=document.createElement("em");em.textContent=D.title.slice(i+1);t.appendChild(em);}else{t.textContent=D.title;}})();
  document.getElementById("intro").textContent=D.intro;
  document.getElementById("foot").textContent=D.title+" "+D.version+" · 체크 상태는 이 브라우저에만 저장됩니다.";

  var main=document.getElementById("main"), nav=document.getElementById("nav");
  D.sections.forEach(function(s){
    var li=el("li"), a=el("a",null,s.navTitle||s.title); a.href="#"+s.id; li.appendChild(a); nav.appendChild(li);

    var sec=el("section"); sec.id=s.id;
    var head=el("div","sec-head"); head.appendChild(el("h2",null,s.title));
    if(s.tag) head.appendChild(el("span","tag "+(s.tagType||"opt"),s.tag));
    sec.appendChild(head);
    if(s.desc) sec.appendChild(el("p","sec-desc",s.desc));

    if(s.groups){
      s.groups.forEach(function(g){
        var box=el("div","group"); box.appendChild(el("h3",null,g.title)); box.appendChild(list(g.items)); sec.appendChild(box);
      });
    }else{
      var box=el("div","group"+(s.final?" final":""));
      if(s.intro) box.appendChild(el("p","intro",s.intro));
      box.appendChild(list(s.items)); sec.appendChild(box);
    }
    if(s.final && D.note) sec.appendChild(el("div","note",D.note));
    main.appendChild(sec);
  });

  function update(){
    var n=inputs.filter(function(b){return b.checked}).length,t=inputs.length,p=t?Math.round(n/t*100):0;
    document.getElementById("pct").textContent=p+"%";
    document.getElementById("cnt").textContent=n+" / "+t+" 항목 완료";
    document.getElementById("fill").style.width=p+"%";
    try{localStorage.setItem(KEY,JSON.stringify(inputs.filter(function(b){return b.checked}).map(function(b){return b.dataset.key})));}catch(e){}
  }
  document.getElementById("reset").addEventListener("click",function(){inputs.forEach(function(b){b.checked=false});update();});

  var links=[].slice.call(nav.querySelectorAll("a"));
  if("IntersectionObserver" in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){
      if(e.isIntersecting) links.forEach(function(a){a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id)});
    });},{rootMargin:"-20% 0px -70% 0px"});
    document.querySelectorAll("main section").forEach(function(s){io.observe(s)});
  }
  update();
})();
</script>
</body>
</html>
